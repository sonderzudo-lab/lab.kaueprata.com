<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 · Apps de Kauê Prata</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0A0B">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
  <style>
    .notfound{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:32px}
    .notfound-inner{width:100%;max-width:1096px}
    .notfound .kicker{margin-bottom:24px}
    .notfound h1{font-size:clamp(80px,18vw,220px);line-height:.78;letter-spacing:-.06em;margin:0 0 44px}
    .notfound p{font-size:clamp(20px,2.5vw,28px);line-height:1.4;color:var(--soft);margin:0 0 34px}
    .notfound a{display:inline-block;padding-bottom:6px;border-bottom:1px solid var(--line-strong);font:13px var(--mono);color:var(--muted)}
    .notfound a:hover{border-color:var(--accent)}
  </style>
</head>
<body>
  <main class="notfound">
    <div class="notfound-inner">
      <p class="kicker">// rota não encontrada</p>
      <h1>404.</h1>
      <p>Esse app não existe — ou ainda não chegou ao laboratório.</p>
      <a href="/">voltar para os projetos ←</a>
    </div>
  </main>
</body>
</html>
